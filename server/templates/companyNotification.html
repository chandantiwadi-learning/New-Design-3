<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
    .container { max-width: 600px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background-color: #ffffff; }
    .header { color: #d32f2f; text-align: center; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 20px; }
    .content p { font-size: 14px; color: #333333; line-height: 1.5; margin: 8px 0; }
    .label { font-weight: bold; color: #555555; display: inline-block; width: 100px; }
    .message-box { background-color: #f9f9f9; padding: 15px; border: 1px solid #eeeeee; border-radius: 4px; margin-top: 20px; white-space: pre-wrap; font-size: 14px; }
    hr { border: none; border-top: 1px solid #eeeeee; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="header">New Contact Form Submission</h2>
    <div class="content">
      <p><span class="label">Ref ID:</span> {{referenceId}}</p>
      <p><span class="label">Date:</span> {{date}}</p>
      <p><span class="label">Time:</span> {{time}}</p>
      <hr/>
      <p><span class="label">Name:</span> {{name}}</p>
      <p><span class="label">Email:</span> {{email}}</p>
      <p><span class="label">Phone:</span> {{phone}}</p>
      <p><span class="label">Company:</span> {{company}}</p>
      <p><span class="label">Country:</span> {{country}}</p>
      <p><span class="label">Subject:</span> {{subject}}</p>
      <p><span class="label">IP Address:</span> {{ip}}</p>
      
      <div class="message-box"><strong>Message:</strong><br/>{{message}}</div>
    </div>
  </div>
</body>
</html>
